<g font-family="Calibri, sans-serif" fill="#000000" text-anchor="middle">
<text x="475" y="135" font-size="17" font-weight="700">Business Owner / Product Owner (Proposed)</text>
<text x="475" y="161" font-size="16">Provide problem, goals, constraints, and source evidence</text>
<text x="475" y="250" font-size="17" font-weight="700">BA / System Analyst</text>
<text x="475" y="276" font-size="16">Identify stakeholders, RACI, scope, and open decisions</text>
<text x="475" y="365" font-size="17" font-weight="700">BA / System Analyst</text>
<text x="475" y="391" font-size="16">Draft BRD, PRD, FSD, rules, and acceptance criteria</text>
<text x="475" y="480" font-size="17" font-weight="700">BA / System Analyst</text>
<text x="475" y="506" font-size="16">Render workflow, swimlane, sequence diagram, and ERD</text>
<text x="475" y="595" font-size="17" font-weight="700">Engineering Review (Proposed)</text>
<text x="475" y="621" font-size="16">Review data model, architecture, APIs, and constraints</text>
<text x="475" y="710" font-size="17" font-weight="700">QA + Business Review (Proposed)</text>
<text x="475" y="736" font-size="16">Review UAT, traceability, gaps, and pending decisions</text>
<text x="475" y="825" font-size="17" font-weight="700">BA / System Analyst</text>
<text x="475" y="851" font-size="16">Deliver three documents: BRD, PRD and FSD</text>
</g>
