<svg xmlns="http://www.w3.org/2000/svg" width="945" height="850" viewBox="0 0 945 850" role="img" aria-labelledby="title desc"><title id="title">Request Submission — Sequence Diagram Example</title><desc id="desc">Rendered sequence diagram of submission, input validation, invalid and valid branches, database save, and response.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4.5 L0 9Z" fill="#000000"/></marker></defs><rect width="945" height="850" fill="white"/><text x="472" y="34" fill="#000000" font-size="24" font-weight="700" font-family="Calibri, sans-serif" text-anchor="middle">Request Submission — Sequence Diagram</text><text x="472" y="56" fill="#000000" font-size="13" font-family="Calibri, sans-serif" text-anchor="middle">Illustrative sequence, not a verified API contract</text>
<rect x="35" y="87" width="162" height="44" rx="5" fill="white" stroke="#222" stroke-width="1.7"/><text x="116" y="115" fill="#000000" font-size="17" font-family="Calibri, sans-serif" text-anchor="middle">User</text><line x1="116" y1="131" x2="116" y2="805" stroke="#888" stroke-width="1.4" stroke-dasharray="6 6"/>
<rect x="235" y="87" width="162" height="44" rx="5" fill="white" stroke="#222" stroke-width="1.7"/><text x="316" y="115" fill="#000000" font-size="17" font-family="Calibri, sans-serif" text-anchor="middle">Frontend</text><line x1="316" y1="131" x2="316" y2="805" stroke="#888" stroke-width="1.4" stroke-dasharray="6 6"/>
<rect x="475" y="87" width="162" height="44" rx="5" fill="#ffffff" stroke="#222" stroke-width="1.7"/><text x="556" y="115" fill="#000000" font-size="17" font-family="Calibri, sans-serif" text-anchor="middle">Backend API</text><line x1="556" y1="131" x2="556" y2="805" stroke="#888" stroke-width="1.4" stroke-dasharray="6 6"/>
<rect x="719" y="87" width="162" height="44" rx="5" fill="white" stroke="#222" stroke-width="1.7"/><text x="800" y="115" fill="#000000" font-size="17" font-family="Calibri, sans-serif" text-anchor="middle">Database</text><line x1="800" y1="131" x2="800" y2="805" stroke="#888" stroke-width="1.4" stroke-dasharray="6 6"/>
<line x1="116" y1="167" x2="305" y2="167" stroke="#222" stroke-width="1.8"  marker-end="url(#a)"/><text x="216" y="156" text-anchor="middle" font-family="Calibri, sans-serif" font-size="14" fill="#000000">Click Submit</text>
<line x1="316" y1="232" x2="545" y2="232" stroke="#222" stroke-width="1.8"  marker-end="url(#a)"/><text x="436" y="221" text-anchor="middle" font-family="Calibri, sans-serif" font-size="14" fill="#000000">POST /requests</text>
<path d="M556 287 H618 V318 H556" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/><text x="628" y="302" font-family="Calibri, sans-serif" font-size="14" fill="#000000">Validate fields</text>
<rect x="21" y="343" width="898" height="461" fill="white" stroke="#444" stroke-width="1.6"/><rect x="21" y="343" width="124" height="28" fill="#ffffff" stroke="#444" stroke-width="1.3"/><text x="83" y="362" text-anchor="middle" font-size="15" font-weight="700" font-family="Calibri, sans-serif">alt</text><text x="162" y="364" font-size="14" font-family="Calibri, sans-serif">Validation fails</text>
<line x1="556" y1="425" x2="327" y2="425" stroke="#222" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#a)"/><text x="436" y="414" text-anchor="middle" font-family="Calibri, sans-serif" font-size="14" fill="#000000">Field errors</text>
