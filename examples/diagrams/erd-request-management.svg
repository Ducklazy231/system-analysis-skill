<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="780" viewBox="0 0 1010 780" role="img" aria-labelledby="title desc">
<title id="title">Example ERD - Request Management</title>
<desc id="desc">Illustrative entity relationship diagram containing User, Request, Request Item, and Approval History, with primary keys, foreign keys, and one-to-many relationships.</desc>
<rect width="1010" height="780" fill="#ffffff"/>
<text x="505" y="38" text-anchor="middle" font-family="Calibri, sans-serif" font-size="26" font-weight="700" fill="#000000">Request Management — ERD Example</text>
<text x="505" y="65" text-anchor="middle" font-family="Calibri, sans-serif" font-size="15" fill="#000000">Illustrative entities and relationships, not an approved database schema</text>
<g stroke="#000000" fill="#ffffff" stroke-width="1.8">
<rect x="60" y="125" width="340" height="228" rx="2"/>
<rect x="560" y="125" width="390" height="270" rx="2"/>
<rect x="60" y="494" width="340" height="225" rx="2"/>
<rect x="560" y="494" width="390" height="225" rx="2"/>
<line x1="60" y1="177" x2="400" y2="177"/>
<line x1="560" y1="177" x2="950" y2="177"/>
<line x1="60" y1="546" x2="400" y2="546"/>
<line x1="560" y1="546" x2="950" y2="546"/>
</g>
<g font-family="Calibri, sans-serif" fill="#000000">
<text x="230" y="159" font-size="23" font-weight="700" text-anchor="middle">User</text>
<text x="755" y="159" font-size="23" font-weight="700" text-anchor="middle">Request</text>
<text x="230" y="528" font-size="23" font-weight="700" text-anchor="middle">Request Item</text>
<text x="755" y="528" font-size="23" font-weight="700" text-anchor="middle">Approval History</text>
</g>
<g font-family="Calibri, sans-serif" font-size="18" fill="#000000">
<text x="82" y="213">PK  user_id</text><text x="82" y="245">user_name</text><text x="82" y="277">email</text><text x="82" y="309">is_active</text>
<text x="582" y="213">PK  request_id</text><text x="582" y="245">FK  created_by_user_id</text><text x="582" y="277">status</text><text x="582" y="309">submitted_at</text><text x="582" y="341">created_at</text>
<text x="82" y="582">PK  item_id</text><text x="82" y="614">FK  request_id</text><text x="82" y="646">item_code</text><text x="82" y="678">quantity</text>
<text x="582" y="582">PK  approval_id</text><text x="582" y="614">FK  request_id</text><text x="582" y="646">FK  approver_user_id</text><text x="582" y="678">decision, decided_at</text>
</g>
