<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1170" viewBox="0 0 1680 1170" role="img" aria-labelledby="title desc">
<title id="title">Request Management ERD with separated Primary and Foreign Keys</title>
<desc id="desc">Illustrative entity relationship diagram. Entity tables do not overlap. Primary Key, Foreign Key, and Attributes groups are separated by solid horizontal rules. Connector lines are routed through open whitespace and diagram is shown at full readable size.</desc>
